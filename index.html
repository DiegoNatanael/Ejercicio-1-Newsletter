<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="resources/favicon.ico" type="image/x-icon" sizes="96x96" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/styles.css">
  <title>Join Our Newsletter</title>
</head>

<body>
  <main class="container">
    <header class="header">
      <img src="resources/logo.svg" alt="Company Logo" class="logo" id="main-logo">
      <h1 class="title">Join our newsletter</h1>
      <p class="description">
        Keep up with our latest collections, exclusive deals, and special offers!
        We introduce a new collection every week, so stay tuned to snag the hottest items just for you.
      </p>
    </header>

    <section class="card" id="subscription-card">
      <form class="subscribe-form" id="newsletter-form">
        <div class="input-group">
          <input type="email" placeholder="Enter your email address" class="email-input" id="email-field" required>
        </div>
        <button type="submit" class="submit-button" id="subscribe-btn">
          Subscribe now
        </button>
      </form>
      <p class="privacy-note">
        Your email is 100% confidential and won’t send you any spam.
      </p>
    </section>

    <footer class="author-info">
      Coded by <a href="https://github.com/DiegoNatanael" target="_blank">Natanael</a>
    </footer>
  </main>
</body>

</html>
